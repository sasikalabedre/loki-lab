services:
  loki:
    image: grafana/loki:3.2.0
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki-data:/loki

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki

  nginx:
    image: nginx:1.27
    container_name: nginx-lab
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx

  app:
    image: python:3.12-slim
    container_name: app-lab
    command: python -u /app/app.py
    volumes:
      - ./app/app.py:/app/app.py:ro
      - ./logs/app:/var/log/app

  alloy:
    image: grafana/alloy:v1.4.2
    container_name: alloy
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs/nginx:/var/log/nginx:ro
      - ./logs/app:/var/log/app:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  processor:
    image: python:3.12-slim
    container_name: processor-lab
    command: python -u /processor/processor.py
    volumes:
      - ./processor/processor.py:/processor/processor.py:ro
      - ./logs/app:/var/log/app:ro
    depends_on:
      - loki

volumes:
  loki-data:
  grafana-data:
  alloy-data:
