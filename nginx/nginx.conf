events {}

http {
  log_format json_logs escape=json
    '{"time":"$time_iso8601",'
    '"ip":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$request_uri",'
    '"status":$status,'
    '"latency_ms":$request_time,'
    '"bytes":$body_bytes_sent}';

  access_log /var/log/nginx/access.log json_logs;

  server {
    listen 80;

    location / {
      return 200 "hello from nginx\n";
    }

    location /error {
      return 500 "server error\n";
    }
  }
}
